<!doctype html><html lang="ko"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.iamport.kr; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://api.iamport.kr https://*.iamport.kr; font-src 'self' data:; frame-src https:;" />
<title>리포트 이용권 결제</title>
<link rel="stylesheet" href="/style.css"/>
<script src="/analytics-consent.js" defer></script>
<script src="/pay-config.js"></script>
<script src="https://cdn.iamport.kr/v1/iamport.js"></script>
<script src="/utils.js"></script>
</head><body>
<div class="wrap"><button class="theme-toggle" id="themeToggle" aria-label="테마 전환" style="position:fixed;top:20px;right:20px;z-index:1000">🌙</button><div class="grid" style="grid-template-columns:minmax(0,1fr)">
<main class="card hero">
  <h1>리포트 이용권 결제</h1>
  <p id="paySummary">주문 정보를 불러오는 중…</p>
  <div class="premium-upsell" id="payCard"></div>
  <div class="form-grid" style="margin-top:12px">
    <input id="reportAge" type="number" min="1" max="120" placeholder="나이 (예: 29)" />
    <select id="reportGender">
      <option value="">성별 선택</option>
      <option value="남성">남성</option>
      <option value="여성">여성</option>
    </select>
    <select id="reportMbti">
      <option value="">MBTI 선택</option>
      <option>INTJ</option><option>INTP</option><option>ENTJ</option><option>ENTP</option>
      <option>INFJ</option><option>INFP</option><option>ENFJ</option><option>ENFP</option>
      <option>ISTJ</option><option>ISFJ</option><option>ESTJ</option><option>ESFJ</option>
      <option>ISTP</option><option>ISFP</option><option>ESTP</option><option>ESFP</option>
    </select>
  </div>
  <p class="note" id="profileHint">결제 전 성별/나이/MBTI를 입력하면 Full 리포트 AI 분석 정확도를 높일 수 있습니다.</p>
  <div class="btns">
    <button class="primary" id="btnPay">결제하고 PDF 받기</button>
    <a class="pill" href="/">🏠 홈</a>
  </div>
  <p class="note">* 리포트 이용권 2개(1,900원)를 구매하고 Starter/Full 리포트에 사용합니다.</p>
</main></div></div>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  const test = params.get('test') || '';
  const result = params.get('result') || '';
  const plan = params.get('plan') || 'starter';
  const draft = params.get('draft') || `${test}:${result}:${plan}`;
  const key = `reportDraft:${draft}`;
  const profileKey = `reportProfile:${draft}`;

  let draftData = null;
  try { draftData = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e) {}

  const reportPackage = (window.VOUCHER_PACKAGES && window.VOUCHER_PACKAGES.report_2) || {
    id: "report_2",
    label: "리포트 이용권 2개",
    price: 1900,
    reportCredits: 2
  };
  const amount = Number(reportPackage.price || 1900);
  const credits = Number(reportPackage.reportCredits || 2);
  const orderName = `${reportPackage.label} 구매`;

  document.getElementById('paySummary').textContent = `${draftData?.testTitle || test} · ${draftData?.resultTitle || result || '결과'} 리포트 이용권 구매`;
  document.getElementById('payCard').innerHTML = `
    <p class="premium-label">결제 금액</p>
    <p class="premium-price">💵 ${amount.toLocaleString()}원</p>
    <p class="premium-sub">지급 이용권: 리포트 ${credits}개</p>
    <p class="premium-sub">차감 규칙: Starter 1개 / Full 2개</p>
  `;

  const ageInput = document.getElementById('reportAge');
  const genderSelect = document.getElementById('reportGender');
  const mbtiSelect = document.getElementById('reportMbti');
  try {
    const saved = JSON.parse(localStorage.getItem(profileKey) || 'null');
    if (saved && typeof saved === 'object') {
      ageInput.value = Number(saved.age || '') || '';
      genderSelect.value = String(saved.gender || '');
      mbtiSelect.value = String(saved.mbti || '');
    }
  } catch (e) {}

  function saveProfileOrThrow() {
    const age = Number(ageInput.value || 0);
    const gender = String(genderSelect.value || '');
    const mbti = String(mbtiSelect.value || '').toUpperCase();
    if (!age || age < 1 || age > 120) throw new Error('나이를 정확히 입력해주세요.');
    if (!gender) throw new Error('성별을 선택해주세요.');
    if (!mbti) throw new Error('MBTI를 선택해주세요.');
    const profile = { age, gender, mbti, savedAt: Date.now() };
    localStorage.setItem(profileKey, JSON.stringify(profile));
    return profile;
  }

  function goSuccess(paymentId){
    const success = new URL('/pay/success.html', location.origin);
    success.searchParams.set('test', test);
    success.searchParams.set('result', result);
    success.searchParams.set('plan', plan);
    success.searchParams.set('draft', draft);
    success.searchParams.set('package', reportPackage.id);
    success.searchParams.set('paymentId', paymentId || `demo_${Date.now()}`);
    location.href = success.toString();
  }

  document.getElementById('btnPay').onclick = function(){
    try {
      saveProfileOrThrow();
    } catch (e) {
      alert(e.message || e);
      return;
    }

    const impCode = window.PAY_CONFIG?.portone?.impCode;
    const pg = plan === 'full' ? window.PAY_CONFIG?.portone?.pgFull : window.PAY_CONFIG?.portone?.pgStarter;
    if (!impCode || !pg || !window.IMP) {
      goSuccess();
      return;
    }

    const IMP = window.IMP;
    IMP.init(impCode);
    IMP.request_pay({
      pg,
      pay_method: 'card',
      merchant_uid: `report_${test}_${result}_${plan}_${Date.now()}`,
      name: orderName,
      amount,
      m_redirect_url: location.href
    }, function(rsp){
      if (rsp.success) {
        goSuccess(rsp.imp_uid || rsp.merchant_uid);
      } else {
        const fail = new URL('/pay/fail.html', location.origin);
        fail.searchParams.set('message', rsp.error_msg || '결제에 실패했습니다.');
        location.href = fail.toString();
      }
    });
  };
})();
</script>
<script>
// Initialize theme toggle
const themeToggle = document.getElementById("themeToggle");
if (themeToggle) {
  const isLight = document.documentElement.classList.contains("light-theme");
  themeToggle.textContent = isLight ? "☀️" : "🌙";
  themeToggle.addEventListener("click", toggleTheme);
}
</script>
</body></html>
