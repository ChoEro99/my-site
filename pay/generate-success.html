<!doctype html><html lang="ko"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; font-src 'self' data:; frame-src https:;" />
<title>생성권 결제 완료</title>
<link rel="stylesheet" href="/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>
<script src="/pay-config.js"></script>
<script src="/utils.js"></script>
</head><body>
<div class="wrap"><button class="theme-toggle" id="themeToggle" aria-label="테마 전환" style="position:fixed;top:20px;right:20px;z-index:1000">🌙</button><div class="grid" style="grid-template-columns:minmax(0,1fr)">
<main class="card hero">
  <h1>결제가 완료되었습니다 ✅</h1>
  <p id="successSummary">생성권을 반영하고 있습니다.</p>
  <div class="btns">
    <a class="go" href="/create-test.html">AI 테스트 만들러 가기</a>
    <a class="pill" href="/">🏠 홈</a>
  </div>
</main></div></div>
<script>
(function(){
  async function init(){
    let user = null;
    if (window.Supa?.isEnabled && window.Supa.isEnabled()) {
      user = await window.Supa.getCurrentUser();
    } else {
      user = window.Auth?.getCurrentUser ? window.Auth.getCurrentUser() : null;
    }
    if (!user) {
      alert('로그인이 필요합니다.');
      location.href = '/create-test.html';
      return;
    }

    const paymentId = new URLSearchParams(location.search).get('paymentId') || `demo_${Date.now()}`;
    const packageId = new URLSearchParams(location.search).get('package') || 'generation_1';
    const packages = window.VOUCHER_PACKAGES || {
      generation_1: { id: "generation_1", label: "테스트 생성권 1개", price: 1900, generationCredits: 1, reportCredits: 0 },
      report_2: { id: "report_2", label: "리포트 이용권 2개", price: 1900, generationCredits: 0, reportCredits: 2 },
      combo_1_2: { id: "combo_1_2", label: "생성권 1개 + 리포트권 2개", price: 2900, generationCredits: 1, reportCredits: 2 }
    };
    const pkg = packages[packageId] || packages.generation_1;
    const generationCredits = Number(pkg.generationCredits || 0);
    const reportCredits = Number(pkg.reportCredits || 0);

    if (window.Supa?.isEnabled && window.Supa.isEnabled()) {
      if (generationCredits > 0) await window.Supa.addCredits(user.id, generationCredits);
      if (reportCredits > 0) await window.Supa.addReportCredits(user.id, reportCredits);
    } else {
      const walletKey = 'genCreditsV1';
      const wallet = JSON.parse(localStorage.getItem(walletKey) || '{}');
      wallet[user.id] = Number(wallet[user.id] || 0) + generationCredits;
      localStorage.setItem(walletKey, JSON.stringify(wallet));

      const reportWalletKey = 'reportCreditsV1';
      const reportWallet = JSON.parse(localStorage.getItem(reportWalletKey) || '{}');
      reportWallet[user.id] = Number(reportWallet[user.id] || 0) + reportCredits;
      localStorage.setItem(reportWalletKey, JSON.stringify(reportWallet));
    }

    const historyKey = 'genPaymentsV1';
    const history = JSON.parse(localStorage.getItem(historyKey) || '[]');
    history.unshift({
      userId: user.id,
      paymentId,
      packageId,
      generationCredits,
      reportCredits,
      amount: Number(pkg.price || 0),
      createdAt: Date.now()
    });
    localStorage.setItem(historyKey, JSON.stringify(history.slice(0, 200)));

    const email = user.email || '';
    document.getElementById('successSummary').textContent = `${email} · 생성권 ${generationCredits}개 / 리포트 이용권 ${reportCredits}개 지급 완료`;
  }
  init();
})();
</script>
<script>
const themeToggle = document.getElementById("themeToggle");
if (themeToggle) {
  const isLight = document.documentElement.classList.contains("light-theme");
  themeToggle.textContent = isLight ? "☀️" : "🌙";
  if (typeof toggleTheme === "function") themeToggle.addEventListener("click", toggleTheme);
}
</script>
</body></html>
