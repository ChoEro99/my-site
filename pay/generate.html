<!doctype html><html lang="ko"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.iamport.kr https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://api.iamport.kr https://*.iamport.kr https://*.supabase.co; font-src 'self' data:; frame-src https:;" />
<title>AI 테스트 생성권 결제</title>
<link rel="stylesheet" href="/style.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/supabase-client.js"></script>
<script src="/auth.js"></script>
<script src="/pay-config.js"></script>
<script src="https://cdn.iamport.kr/v1/iamport.js"></script>
<script src="/utils.js"></script>
<style>
  .pay-card{
    margin-top:12px;
    padding:16px;
    border-radius:16px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  }
  .pay-card .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
  .pay-card .label{font-weight:700}
  .pay-card .amount{font-size:28px;font-weight:900}
  .pay-card .meta{margin-top:10px;color:var(--muted)}
  .pay-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .pay-actions .go{margin-top:0}
  .pay-back{
    min-height:50px;
    padding:0 18px;
    border-radius:14px;
    border:1px solid var(--line);
    color:var(--text);
    background:rgba(255,255,255,.04);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
  }
  .pay-back:hover{transform:translateY(-1px)}
</style>
</head><body>
<div class="wrap"><button class="theme-toggle" id="themeToggle" aria-label="테마 전환" style="position:fixed;top:20px;right:20px;z-index:1000">🌙</button><div class="grid" style="grid-template-columns:minmax(0,1fr)">
<main class="card hero">
  <h1>이용권 결제</h1>
  <p id="paySummary">주문 정보를 확인 중입니다.</p>
  <div class="pay-card" id="payCard"></div>
  <div class="pay-card" id="packageSelector" style="margin-top:10px"></div>
  <div class="btns pay-actions">
    <button class="primary" id="btnPay">결제하기</button>
    <a class="pay-back" href="/create-test.html">이전으로</a>
  </div>
  <p class="note">* 결제 완료 시 생성권이 즉시 지급됩니다.</p>
</main></div></div>
<script>
(function(){
  let user = null;
  let selectedPackageId = "generation_1";

  function getPackages() {
    const fallback = {
      generation_1: { id: "generation_1", label: "테스트 생성권 1개", price: 1900, generationCredits: 1, reportCredits: 0 },
      report_2: { id: "report_2", label: "리포트 이용권 2개", price: 1900, generationCredits: 0, reportCredits: 2 },
      combo_1_2: { id: "combo_1_2", label: "생성권 1개 + 리포트권 2개", price: 2900, generationCredits: 1, reportCredits: 2 }
    };
    return window.VOUCHER_PACKAGES || fallback;
  }

  function renderPackageInfo(pkg) {
    const amount = Number(pkg?.price || 0);
    const generationCredits = Number(pkg?.generationCredits || 0);
    const reportCredits = Number(pkg?.reportCredits || 0);
    document.getElementById('payCard').innerHTML = `
      <div class="row">
        <span class="label">선택 상품</span>
        <span class="amount">${pkg?.label || "이용권"}</span>
      </div>
      <div class="meta">결제 금액: 💵 ${amount.toLocaleString()}원</div>
      <div class="meta">테스트 생성권: ${generationCredits}개 · 리포트 이용권: ${reportCredits}개</div>
    `;
  }

  function renderPackageSelector(packages) {
    const entries = Object.values(packages || {});
    document.getElementById('packageSelector').innerHTML = entries.map((pkg) => `
      <label style="display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer">
        <input type="radio" name="voucherPackage" value="${pkg.id}" ${pkg.id === selectedPackageId ? "checked" : ""} />
        <span>${pkg.label} (${Number(pkg.price || 0).toLocaleString()}원)</span>
      </label>
    `).join("");
    document.querySelectorAll('input[name="voucherPackage"]').forEach((el) => {
      el.addEventListener('change', () => {
        selectedPackageId = el.value;
        renderPackageInfo(packages[selectedPackageId]);
      });
    });
  }

  function toLocalUser(u) {
    if (!u) return null;
    return { id: u.id, email: u.email || '', name: u.user_metadata?.name || '' };
  }

  async function init() {
    if (window.Supa?.isEnabled && window.Supa.isEnabled()) {
      user = toLocalUser(await window.Supa.getCurrentUser());
    } else {
      user = window.Auth?.getCurrentUser ? window.Auth.getCurrentUser() : null;
    }
    if (!user) {
      alert('로그인이 필요합니다.');
      location.href = '/create-test.html';
      return;
    }

    const packages = getPackages();
    const fromQuery = new URLSearchParams(location.search).get("package");
    if (fromQuery && packages[fromQuery]) selectedPackageId = fromQuery;
    const pkg = packages[selectedPackageId];
    const orderName = pkg.label;

    document.getElementById('paySummary').textContent = `${user.email} · 이용권 상품 결제`;
    renderPackageInfo(pkg);
    renderPackageSelector(packages);

    function goSuccess(paymentId){
      const success = new URL('/pay/generate-success.html', location.origin);
      success.searchParams.set('paymentId', paymentId || `demo_${Date.now()}`);
      success.searchParams.set('package', selectedPackageId);
      location.href = success.toString();
    }

    document.getElementById('btnPay').onclick = function(){
      const selected = packages[selectedPackageId] || packages.generation_1;
      const amount = Number(selected.price || 0);
      const orderLabel = selected.label || '이용권';
      const impCode = window.PAY_CONFIG?.portone?.impCode;
      const pg = window.PAY_CONFIG?.portone?.pgFull || window.PAY_CONFIG?.portone?.pgStarter;
      if (!impCode || !pg || !window.IMP) {
        goSuccess();
        return;
      }
      const IMP = window.IMP;
      IMP.init(impCode);
      IMP.request_pay({
        pg,
        pay_method: 'card',
        merchant_uid: `gen_${user.id}_${Date.now()}`,
        name: orderLabel,
        amount,
        m_redirect_url: location.href
      }, function(rsp){
        if (rsp.success) {
          goSuccess(rsp.imp_uid || rsp.merchant_uid);
        } else {
          const fail = new URL('/pay/fail.html', location.origin);
          fail.searchParams.set('message', rsp.error_msg || '결제에 실패했습니다.');
          location.href = fail.toString();
        }
      });
    };
  }

  init();
})();
</script>
<script>
const themeToggle = document.getElementById("themeToggle");
if (themeToggle) {
  const isLight = document.documentElement.classList.contains("light-theme");
  themeToggle.textContent = isLight ? "☀️" : "🌙";
  if (typeof toggleTheme === "function") themeToggle.addEventListener("click", toggleTheme);
}
</script>
</body></html>
