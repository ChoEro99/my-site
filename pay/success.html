<!doctype html><html lang="ko"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; frame-src https:;" />
<title>결제 완료</title>
<link rel="stylesheet" href="/style.css"/>
<script src="/pay-config.js"></script>
<script src="/utils.js"></script>
</head><body>
<div class="wrap"><button class="theme-toggle" id="themeToggle" aria-label="테마 전환" style="position:fixed;top:20px;right:20px;z-index:1000">🌙</button><div class="grid" style="grid-template-columns:minmax(0,1fr)">
<main class="card hero">
  <h1>결제가 완료되었습니다 ✅</h1>
  <p id="successSummary">주문 정보를 확인 중입니다.</p>
  <div class="btns">
    <a class="go" id="btnReport" href="#">PDF 받으러 가기</a>
    <a class="pill" href="/">🏠 홈</a>
  </div>
</main></div></div>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const test = p.get('test') || '';
  const result = p.get('result') || '';
  const plan = p.get('plan') || 'starter';
  const draft = p.get('draft') || `${test}:${result}:${plan}`;
  const paymentId = p.get('paymentId') || `demo_${Date.now()}`;
  const creditsByPlan = {
    starter: Number((window.REPORT_CREDITS && window.REPORT_CREDITS.starter) || 1),
    full: Number((window.REPORT_CREDITS && window.REPORT_CREDITS.full) || 2)
  };
  const purchasedCredits = creditsByPlan[plan] || creditsByPlan.starter;
  const purchaseKey = `reportPurchase:${draft}`;
  const packKey = `reportPack:${plan}`;

  let pack = null;
  try { pack = JSON.parse(localStorage.getItem(packKey) || 'null'); } catch (e) {}
  if (!pack || typeof pack !== 'object') {
    pack = { plan, remaining: 0, purchased: 0, usedDrafts: {} };
  }
  const usedDrafts = (pack.usedDrafts && typeof pack.usedDrafts === 'object') ? pack.usedDrafts : {};

  pack.plan = plan;
  pack.remaining = Number(pack.remaining || 0) + purchasedCredits;
  pack.purchased = Number(pack.purchased || 0) + purchasedCredits;
  pack.lastPaymentId = paymentId;
  pack.updatedAt = Date.now();
  pack.usedDrafts = usedDrafts;
  localStorage.setItem(packKey, JSON.stringify(pack));

  localStorage.setItem(purchaseKey, JSON.stringify({
    paid: true,
    paymentId,
    purchasedAt: Date.now(),
    test,
    result,
    plan,
    credits: purchasedCredits,
    packKey
  }));

  document.getElementById('successSummary').textContent = `${test} / ${result} / ${plan.toUpperCase()} 구매 완료 · AI 리포트 ${purchasedCredits}회 지급`;
  const reportUrl = new URL('/report/pdf.html', location.origin);
  reportUrl.searchParams.set('test', test);
  reportUrl.searchParams.set('result', result);
  reportUrl.searchParams.set('plan', plan);
  reportUrl.searchParams.set('draft', draft);
  document.getElementById('btnReport').href = reportUrl.toString();
})();
</script>
<script>
// Initialize theme toggle
const themeToggle = document.getElementById("themeToggle");
if (themeToggle) {
  const isLight = document.documentElement.classList.contains("light-theme");
  themeToggle.textContent = isLight ? "☀️" : "🌙";
  themeToggle.addEventListener("click", toggleTheme);
}
</script>
</body></html>
