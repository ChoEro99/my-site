<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com; font-src 'self' data:; frame-src https:;" />
<title>사이트 소개</title>
<link rel="stylesheet" href="/style.css"/>
<script src="/utils.js"></script>
<script src="/analytics-consent.js" defer></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6051453612452994"
     crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <b>사이트 소개</b>
    <span>심리 테스트 콘텐츠 플랫폼</span>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">🌙</button>
  <div class="pill"><a href="/">홈</a></div>
</header>

<main class="card">
<h1 style="margin-bottom:10px">소개</h1>
<p style="color:var(--muted)">
본 사이트는 재미를 위한 심리/성향 테스트 콘텐츠를 제공합니다.
의료, 상담, 진단 목적이 아니며 단순 오락용 콘텐츠입니다.
</p>

<p style="color:var(--muted)">
테스트 결과는 서버에 저장되지 않으며,
브라우저 내에서만 동작합니다.
</p>
</main>

<div class="footer">
© <span id="year"></span> · <a href="#" id="btnConsentSettings">쿠키 설정</a>
</div>
</div>
<script>
document.getElementById("year").textContent = new Date().getFullYear();

// Initialize theme toggle
const themeToggle = document.getElementById("themeToggle");
if (themeToggle) {
  const isLight = document.documentElement.classList.contains("light-theme");
  themeToggle.textContent = isLight ? "☀️" : "🌙";
  themeToggle.addEventListener("click", toggleTheme);
}
document.getElementById("btnConsentSettings")?.addEventListener("click", function (event) {
  event.preventDefault();
  if (typeof window.openConsentSettings === "function") window.openConsentSettings();
});
</script>
</body>
</html>
