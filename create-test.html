<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://accounts.google.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://generativelanguage.googleapis.com https://*.supabase.co; font-src 'self' data:; frame-src https://accounts.google.com https:;" />
  <title>AI 심리테스트 만들기</title>
  <meta name="description" content="로그인 후 결제로 AI 심리테스트를 생성하고 보관할 수 있습니다." />
  <link rel="stylesheet" href="/style.css" />
  <script src="/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-config.js"></script>
  <script src="/supabase-client.js"></script>
  <script src="/pay-config.js"></script>
  <script src="/gemini-config.js"></script>
  <script src="/analytics-consent.js" defer></script>
  <style>
    .creator-page .card.mini { border-radius: 20px; }
    .creator-row-two,
    .creator-row-three {
      display: grid;
      gap: 12px;
      align-items: stretch;
    }
    .creator-row-two { grid-template-columns: 1fr 1fr; }
    .creator-row-three { grid-template-columns: 1fr 1fr 160px; }
    .creator-row-two input,
    .creator-row-three select,
    .creator-row-three button,
    .member-actions .go,
    .member-actions button,
    .result-actions button,
    .library-action {
      min-height: 56px;
      border-radius: 16px;
      font-size: 18px;
    }
    .member-actions,
    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .member-actions .go,
    .member-actions button { min-width: 170px; justify-content: center; display: inline-flex; align-items: center; }
    .member-actions .go { margin-top: 0; }
    .result-actions button { min-width: 190px; }
    .library-action { margin-top: 10px; min-width: 170px; }
    @media (max-width: 980px) {
      .creator-row-two,
      .creator-row-three { grid-template-columns: 1fr; }
      .creator-row-three button { width: 100%; }
      .member-actions .go,
      .member-actions button,
      .result-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <b>AI 심리테스트 만들기</b>
        <span>로그인 + 결제 생성권으로 테스트 생성/보관</span>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">🌙</button>
        <a class="pill" href="/">🏠 홈</a>
      </div>
    </header>

    <div class="grid" style="grid-template-columns:minmax(0,1fr)">
      <main class="card hero creator-page">
        <h1>원하는 테스트를 바로 만들어보세요</h1>
        <p>생성권 1회로 테스트 1개 생성 + 심층 리포트 PDF 1회 다운로드 권한이 부여됩니다.</p>

        <section class="card mini" id="authCard" style="padding:14px;margin-top:12px;display:none">
          <h4>로그인</h4>
          <div class="btns member-actions">
            <button id="btnGoogleLogin" class="primary" type="button">Google로 로그인</button>
          </div>
          <p id="authStatus" class="search-meta">로그인 후 생성 기능을 사용할 수 있습니다.</p>
        </section>

        <section class="card mini" id="memberCard" style="padding:14px;margin-top:12px;display:none">
          <h4 id="memberTitle">회원 정보</h4>
          <p id="memberMeta" class="search-meta"></p>
          <div class="btns member-actions">
            <a class="go" href="/pay/generate.html">생성권 결제하기</a>
            <button id="btnLogout" type="button">로그아웃</button>
          </div>
        </section>

        <section id="generatorPanel" style="display:block">
          <div class="home-tools creator-row-two" style="margin-top:14px">
            <input id="topic" type="text" placeholder="주제 (예: 연애 갈등 대화 스타일)" />
            <input id="age" type="text" placeholder="나이 (예: 20대 후반, 34세)" />
          </div>

          <div class="home-tools creator-row-three">
            <select id="gender" aria-label="성별 선택">
              <option value="">성별 선택</option>
              <option value="여성">여성</option>
              <option value="남성">남성</option>
            </select>
            <select id="mbti" aria-label="MBTI 선택">
              <option value="">MBTI 선택</option>
              <option value="ISTJ">ISTJ</option>
              <option value="ISFJ">ISFJ</option>
              <option value="INFJ">INFJ</option>
              <option value="INTJ">INTJ</option>
              <option value="ISTP">ISTP</option>
              <option value="ISFP">ISFP</option>
              <option value="INFP">INFP</option>
              <option value="INTP">INTP</option>
              <option value="ESTP">ESTP</option>
              <option value="ESFP">ESFP</option>
              <option value="ENFP">ENFP</option>
              <option value="ENTP">ENTP</option>
              <option value="ESTJ">ESTJ</option>
              <option value="ESFJ">ESFJ</option>
              <option value="ENFJ">ENFJ</option>
              <option value="ENTJ">ENTJ</option>
            </select>
            <button class="primary" id="btnGenerate" type="button">AI로 만들기</button>
          </div>

          <p id="genStatus" class="search-meta">생성하려면 로그인 + 생성권 결제가 필요합니다.</p>

          <div class="card mini" id="resultCard" style="padding:14px;margin-top:12px;display:none">
            <h4 id="resultTitle">생성 완료</h4>
            <p id="resultMeta" class="note" style="margin:0 0 8px"></p>
            <div class="btns result-actions">
              <button class="primary" id="btnStartNow" type="button">바로 테스트 시작</button>
            </div>
          </div>

        </section>

        <section class="card mini" style="padding:14px;margin-top:12px">
          <h4>내가 만든 테스트 보관함</h4>
          <div id="libraryEmpty" class="note">아직 생성된 테스트가 없습니다.</div>
          <div id="libraryList" class="choices"></div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const GENERATED_TEST_KEY = "generatedTestDraft";
    const GENERATED_TEST_META_KEY = "generatedTestMeta";
    const GEN_TESTS_KEY = "generatedTestsV1";
    const GEN_WALLET_KEY = "genCreditsV1";

    let currentUser = null;
    let latestRecord = null;
    let isGenerating = false;
    const useSupabase = () => !!(window.Supa && window.Supa.isEnabled && window.Supa.isEnabled());

    function safeParse(raw, fallback) { try { return JSON.parse(raw || ""); } catch (e) { return fallback; } }
    function setThemeToggle() {
      const t = $("themeToggle");
      if (!t) return;
      const isLight = document.documentElement.classList.contains("light-theme");
      t.textContent = isLight ? "☀️" : "🌙";
      if (typeof window.toggleTheme === "function") t.addEventListener("click", toggleTheme);
    }
    function safeTrack(name, data) { if (typeof window.track === "function") window.track(name, data || {}); }
    function setAuthStatus(msg) { const el = $("authStatus"); if (el) el.textContent = msg; }
    window.addEventListener("beforeunload", (event) => {
      if (!isGenerating) return;
      event.preventDefault();
      event.returnValue = "";
    });

    function localGetWallet() { const v = safeParse(localStorage.getItem(GEN_WALLET_KEY), {}); return v && typeof v === "object" ? v : {}; }
    function localGetCredits(uid) { return Number(localGetWallet()[uid] || 0); }
    function localSetCredits(uid, value) { const w = localGetWallet(); w[uid] = Math.max(0, Number(value || 0)); localStorage.setItem(GEN_WALLET_KEY, JSON.stringify(w)); }
    function localGetAllTests() { const v = safeParse(localStorage.getItem(GEN_TESTS_KEY), []); return Array.isArray(v) ? v : []; }
    function localSaveAllTests(v) { localStorage.setItem(GEN_TESTS_KEY, JSON.stringify(v || [])); }

    async function getCurrentUser() {
      if (!useSupabase()) return null;
      return await window.Supa.getCurrentUser();
    }

    async function getCredits(uid) {
      if (!useSupabase()) return localGetCredits(uid);
      return await window.Supa.getCredits(uid);
    }

    async function addCredits(uid, delta) {
      if (useSupabase()) return await window.Supa.addCredits(uid, delta);
      const next = localGetCredits(uid) + Number(delta || 0);
      localSetCredits(uid, next);
      return next;
    }

    async function setCredits(uid, value) {
      if (useSupabase()) return await window.Supa.setCredits(uid, value);
      localSetCredits(uid, value);
    }

    async function listTests(uid) {
      if (!useSupabase()) return localGetAllTests().filter((x) => x.ownerId === uid);
      return await window.Supa.listGeneratedTests(uid);
    }

    async function saveTestRecord(uid, testObj, reportDownloads) {
      if (useSupabase()) return await window.Supa.saveGeneratedTest(uid, testObj, reportDownloads);
      const id = "g_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
      const rec = { id, ownerId: uid, createdAt: Date.now(), paid: true, reportDownloadsRemaining: reportDownloads, test: testObj };
      const all = localGetAllTests(); all.unshift(rec); localSaveAllTests(all); return rec;
    }

    function slugify(text) {
      return String(text || "").trim().toLowerCase().replace(/[^a-z0-9가-힣\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "") || "new-test";
    }
    function sanitizeKeyName(text, idx) { const k = String(text || "").trim().toLowerCase().replace(/[^a-z0-9가-힣]/g, ""); return k || `type${idx + 1}`; }
    function extractJson(text) {
      const raw = String(text || "").trim();
      if (!raw) throw new Error("응답이 비어 있습니다.");
      const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
      return JSON.parse((fence ? fence[1] : raw).trim());
    }

    function validateAndNormalize(testObj, fallbackSlug) {
      if (!testObj || typeof testObj !== "object") throw new Error("JSON 객체가 아닙니다.");
      const typesRaw = Array.isArray(testObj.types) ? testObj.types.slice(0, 4) : [];
      if (typesRaw.length < 4) throw new Error("types는 4개가 필요합니다.");
      const typeKeys = typesRaw.map((x, i) => sanitizeKeyName(x, i));
      if (new Set(typeKeys).size !== 4) throw new Error("types 키가 중복되었습니다.");

      const out = {
        slug: slugify(testObj.slug || fallbackSlug),
        badge: String(testObj.badge || "AI 테스트"),
        storageKey: "",
        ogTitle: String(testObj.ogTitle || testObj.title || "AI 심리테스트"),
        ogDesc: String(testObj.ogDesc || "AI로 생성한 심리테스트"),
        ogImage: location.origin + "/og.png",
        types: typeKeys,
        results: {},
        questions: []
      };
      out.storageKey = `lastResult_${out.slug}`;

      const resultsObj = testObj.results || {};
      typeKeys.forEach((k, i) => {
        const s = resultsObj[k] || Object.values(resultsObj)[i] || {};
        out.results[k] = {
          emoji: String(s.emoji || "✨"), title: String(s.title || `${k}형`), desc: String(s.desc || "설명 준비 중"),
          tags: Array.isArray(s.tags) ? s.tags.slice(0, 4).map(String) : [],
          strengths: Array.isArray(s.strengths) ? s.strengths.slice(0, 4).map(String) : [],
          pitfalls: Array.isArray(s.pitfalls) ? s.pitfalls.slice(0, 4).map(String) : [],
          routine: Array.isArray(s.routine) ? s.routine.slice(0, 4).map(String) : []
        };
      });

      const qs = Array.isArray(testObj.questions) ? testObj.questions : [];
      if (qs.length < 6) throw new Error("questions는 최소 6개 이상 필요합니다.");
      out.questions = qs.map((q, qi) => {
        const choices = Array.isArray(q.c) ? q.c : [];
        if (choices.length < 4) throw new Error(`${qi + 1}번 문항 선택지는 4개 필요합니다.`);
        return {
          q: String(q.q || `${qi + 1}번 질문`),
          c: choices.slice(0, 4).map((ch, ci) => {
            const score = {};
            typeKeys.forEach((k) => { const v = ch?.s?.[k]; score[k] = Number.isFinite(v) ? Number(v) : 0; });
            if (!Object.values(score).some((v) => v > 0)) score[typeKeys[ci % 4]] = 2;
            return { t: String(ch?.t || `선택지 ${ci + 1}`), s: score };
          })
        };
      });
      return out;
    }

    function openRecord(rec) {
      sessionStorage.setItem(GENERATED_TEST_KEY, JSON.stringify(rec.test));
      sessionStorage.setItem(GENERATED_TEST_META_KEY, JSON.stringify({ id: rec.id, paid: !!rec.paid, reportDownloadsRemaining: Number(rec.reportDownloadsRemaining || 0) }));
      location.href = "/play-generated.html";
    }

    async function renderLibrary() {
      const list = $("libraryList"); const empty = $("libraryEmpty"); list.innerHTML = "";
      if (!currentUser) { empty.style.display = "block"; empty.textContent = "로그인 후 생성한 테스트가 여기에 보관됩니다."; return; }
      const mine = await listTests(currentUser.id);
      if (!mine.length) { empty.style.display = "block"; empty.textContent = "아직 생성된 테스트가 없습니다."; return; }
      empty.style.display = "none";
      mine.forEach((it) => {
        const d = document.createElement("div"); d.className = "choice";
        d.innerHTML = `<div style="font-weight:700">${it.test?.ogTitle || "AI 생성 테스트"}</div><div class="note" style="margin:0">${(it.test?.questions||[]).length}문항 · 리포트 남은 다운로드 ${Number(it.reportDownloadsRemaining || 0)}회</div>`;
        const b = document.createElement("button"); b.type = "button"; b.className = "primary library-action"; b.textContent = "이 테스트 시작"; b.onclick = () => openRecord(it);
        d.appendChild(b); list.appendChild(d);
      });
    }

    function initGoogleLogin() {
      if (currentUser) return;
      const btn = $("btnGoogleLogin");
      if (!btn) return;
      btn.onclick = async () => {
        if (!useSupabase()) {
          setAuthStatus("Supabase 설정이 없어 Google 로그인을 사용할 수 없습니다.");
          return;
        }
        try {
          await window.Supa.signInWithGoogle();
        } catch (e) {
          setAuthStatus(`실패: ${e.message || e}`);
        }
      };
    }

    async function renderAuthState() {
      currentUser = await getCurrentUser();
      const authCard = $("authCard"), memberCard = $("memberCard"), panel = $("generatorPanel"), status = $("genStatus");

      panel.style.display = "block";
      if (!currentUser) {
        authCard.style.display = "block";
        memberCard.style.display = "none";
        status.textContent = useSupabase()
          ? "생성하려면 Google 로그인 + 생성권 결제가 필요합니다."
          : "Supabase 설정이 필요합니다.";
        initGoogleLogin();
        await renderLibrary();
        return;
      }

      authCard.style.display = "none";
      memberCard.style.display = "block";
      const credits = await getCredits(currentUser.id);
      $("memberTitle").textContent = `${currentUser.email} 님`;
      $("memberMeta").textContent = `보유 생성권: ${credits}회`;

      if (!String(window.GEMINI_API_KEY || "").trim()) status.textContent = "설정 오류: Gemini API 키를 읽지 못했습니다.";
      else if (credits <= 0) status.textContent = "생성권이 없습니다. 생성 버튼을 누르면 결제 안내가 표시됩니다.";
      else status.textContent = "준비 완료. 생성권 1회가 차감됩니다.";

      initGoogleLogin();
      await renderLibrary();
    }

    async function generateWithGemini() {
      const apiKey = String(window.GEMINI_API_KEY || "").trim();
      const model = "gemini-2.5-flash";
      const topic = ($("topic").value || "").trim();
      const age = ($("age").value || "").trim();
      const gender = ($("gender").value || "").trim();
      const mbti = ($("mbti").value || "").trim().toUpperCase();
      const questionCount = 12;
      const status = $("genStatus"); const btn = $("btnGenerate");

      if (!currentUser) throw new Error("로그인이 필요합니다.");
      if (!apiKey) throw new Error("Gemini API 키 설정이 필요합니다.");
      if (!topic) throw new Error("주제를 입력해주세요.");
      if (!age) throw new Error("나이를 입력해주세요.");
      if (!gender) throw new Error("성별을 입력해주세요.");
      if (!mbti) throw new Error("MBTI를 입력해주세요.");

      const before = await getCredits(currentUser.id);
      if (before <= 0) throw new Error("생성권이 부족합니다. 결제 후 다시 시도해주세요.");
      let deducted = false;

      const systemPrompt = `너는 한국어 심리테스트 기획자다.\n반드시 JSON만 출력해라. 코드블록/설명/주석 금지.\n의학적 진단/치료를 암시하지 말고 재미/콘텐츠 톤으로 작성해라.\n편견, 혐오, 차별 표현 금지.\n아래 구조를 지켜라:\n{\n  "slug":"영문소문자-하이픈",\n  "badge":"짧은 배지",\n  "ogTitle":"테스트 제목",\n  "ogDesc":"한 줄 소개",\n  "types":["type1","type2","type3","type4"],\n  "results":{\n    "type1":{"emoji":"✨","title":"...형","desc":"...","tags":["","",""] ,"strengths":["","",""] ,"pitfalls":["",""] ,"routine":["","",""]},\n    "type2":{},"type3":{},"type4":{}\n  },\n  "questions":[{"q":"질문","c":[{"t":"선택지1","s":{"type1":2,"type2":0,"type3":0,"type4":0}},{"t":"선택지2","s":{"type1":0,"type2":2,"type3":0,"type4":0}},{"t":"선택지3","s":{"type1":0,"type2":0,"type3":2,"type4":0}},{"t":"선택지4","s":{"type1":0,"type2":0,"type3":0,"type4":2}}]}]\n}`;
      const userPrompt = `주제: ${topic}\n나이: ${age}\n성별: ${gender}\nMBTI: ${mbti}\n톤: 가볍고 이해 쉬운\n문항 수: 12\n출력은 반드시 JSON만.`;

      status.textContent = "AI 생성 중...";
      btn.disabled = true;
      isGenerating = true;
      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const resp = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: `${systemPrompt}\n\n${userPrompt}` }] }],
            generationConfig: { temperature: 0.7, responseMimeType: "application/json" }
          })
        });
        if (!resp.ok) throw new Error(`Gemini API 오류: ${resp.status} ${(await resp.text()).slice(0, 180)}`);

        const json = await resp.json();
        const text = json?.candidates?.[0]?.content?.parts?.[0]?.text || "";
          const parsed = extractJson(text);
          const normalized = validateAndNormalize(parsed, slugify(topic));
          normalized.questions = normalized.questions.slice(0, questionCount);

          await setCredits(currentUser.id, before - 1);
          deducted = true;
          await renderAuthState();

          $("resultCard").style.display = "block";
        $("resultTitle").textContent = normalized.ogTitle;
        $("resultMeta").textContent = `${normalized.questions.length}문항 · ${normalized.types.length}유형 생성 완료`;

        const reportDownloads = Number((window.TEST_GENERATION_PACKAGE && window.TEST_GENERATION_PACKAGE.reportDownloadsPerTest) || 1);
        latestRecord = await saveTestRecord(currentUser.id, normalized, reportDownloads);

        status.textContent = "생성 완료. 바로 테스트를 시작해보세요.";
        safeTrack("ai_test_generated", { slug: normalized.slug, question_count: normalized.questions.length, model });
        await renderAuthState();
        } catch (e) {
          if (deducted) {
            await setCredits(currentUser.id, before);
            await renderAuthState();
          }
          throw e;
        } finally {
        isGenerating = false;
        btn.disabled = false;
      }
    }

    $("btnLogout").addEventListener("click", async () => {
      if (useSupabase()) await window.Supa.signOut();
      latestRecord = null;
      await renderAuthState();
    });

    $("btnGenerate").addEventListener("click", async () => {
      $("genStatus").textContent = "요청 준비 중...";
      try {
        await generateWithGemini();
      } catch (e) {
        $("genStatus").textContent = `실패: ${e.message || e}`;
      }
    });

    $("btnStartNow").addEventListener("click", () => {
      if (!latestRecord) { $("genStatus").textContent = "먼저 테스트를 생성해주세요."; return; }
      openRecord(latestRecord);
    });

    setThemeToggle();
    renderAuthState();
    setTimeout(initGoogleLogin, 300);
  </script>
</body>
</html>
